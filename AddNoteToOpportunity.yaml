kind: AdaptiveDialog
beginDialog:
  kind: OnRecognizedIntent
  id: main
  intent:
    triggerQueries:
      - add note to opportunity
      - attach note to opportunity
      - leave a comment on an opportunity
      - create note for opportunity
      - write a note on this opportunity
      - can I add a note to the opportunity?
      - insert remark in opportunity record
      - update opportunity with a new note
      - save a message for this opportunity

